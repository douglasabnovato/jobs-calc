# Blueprint do Render (plano gratuito): New > Blueprint > selecione este repositório
# O SQLite fica em /tmp: o disco do plano gratuito é temporário e os dados voltam ao padrão a cada reinício ou deploy
# APP_USER e APP_PASSWORD são obrigatórios em produção: sem eles qualquer pessoa com o link edita os jobs
services:
  - type: web
    name: jobs-calc
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_FILE
        value: /tmp/jobs-calc.sqlite
      - key: APP_USER
        sync: false
      - key: APP_PASSWORD
        sync: false
# fim de arquivo
